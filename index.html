 <div class="card" style="margin-top:10px"><h2>Baseline vs. target</h2>${MET.map(m=>{const x=Math.max(m[1],m[2]);return`<div class="row" style="margin-bottom:6px"><div style="width:230px">${m[0]}</div><div style="flex:1;min-width:160px"><div class="row"><div class="bar"><i style="width:${m[1]/x*100}%;background:#8a97b5"></i></div><span style="width:34px">${m[1]}</span></div><div class="row"><div class="bar"><i style="width:${m[2]/x*100}%;background:var(--tl)"></i></div><span style="width:34px">${m[2]}</span></div></div></div>`}).join('')}<div class="mu">Grey = baseline · Teal = target</div></div>
 <div class="card" style="margin-top:10px"><h2>North Star: time returned to member care (min/nurse/day, illustrative ramp)</h2><svg viewBox="0 0 400 140" style="width:100%;max-width:560px"><polyline fill="none" stroke="var(--tl)" stroke-width="3" points="${pts.map((v,i)=>`${30+i*68},${120-v/mx*100}`).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${30+i*68}" cy="${120-v/mx*100}" r="4" fill="var(--pr)"/><text x="${30+i*68}" y="${112-v/mx*100}" font-size="10" text-anchor="middle" fill="var(--tx)">${v}</text>`).join('')}${pts.map((v,i)=>`<text x="${30+i*68}" y="136" font-size="10" text-anchor="middle" fill="var(--mu)">Wk ${i*2}</text>`).join('')}</svg></div>${COH()}<div class="card" style="margin-top:10px"><h2>Guardrails (must not regress)</h2><div class="row"><span class="chip Confirmed">Contact-preference violations: 0</span><span class="chip Confirmed">Unapproved sends: 0</span><span class="chip Reported">RN approvals this session: ${S.log.length}</span></div><div class="fr">Faster is only a win if quality, safety and trust hold.</div></div>`}

const EXP={queue:['Prioritized work queue','Every case is ranked by an explainable priority score. Escalation flags always float to the top, so the nurse starts with the member who needs help first.','Click a member card, then “Start outreach”. Use the band filter to narrow the list.'],
m360:['Member 360','All sources in one place, each fact labelled Confirmed, Reported, Inferred, Unknown or Conflicting with where it came from and how fresh it is. Medication disagreements are shown side by side; nothing is changed automatically.','Open the Medications tab and mark a discrepancy. Open the ✦ AI panel for drafts with sources.'],
out:['Outreach & documentation','Pick a consented channel, review the AI-drafted message, record the outcome, dictate or type the note, and approve. Nothing is sent or saved without the RN ticking an approval box.','Tap 🎙 next to any field or the note to dictate. Then “Save note & complete outreach”.'],
cal:['Calendar','Plans the day around each member’s best contact window and consent, avoiding huddle, lunch and documentation time. “Optimise my day” creates a draft the nurse can accept.','Click “Optimise my day”, then add the plan. It also drives phone notifications.'],
an:['Analytics','Planning baselines versus pilot targets. Figures are illustrative until measured in a pilot.','Compare baseline and target bars.'],
pro:['My profile','Nurse profile, preferences and workload against targets.','Switch theme or AI defaults.'],
ph:['Phone view','What the nurse sees on a phone. Calendar items pop up as notifications ahead of time when notifications are enabled. The clock is simulated for the demo.','Press Play, or drag the clock. Toggle notifications off to see them stop. Tap a notification to open that member’s outreach.']};
function guide(){if(S.mode!='guided'||!EXP[S.v])return'';const e=EXP[S.v];return`<div class="card gd"><span class="chip Inferred">Explainer</span> <b>${e[0]}</b><div>${e[1]}</div><div class="fr"><b>Try:</b> ${e[2]}</div></div>`}
const modeSw=()=>`<div class="msw" role="group" aria-label="Version"><button class="${S.mode!='guided'?'on':''}" onclick="setMode('demo')">Actual demo</button><button class="${S.mode=='guided'?'on':''}" onclick="setMode('guided')">With explanation</button></div>`;
function setMode(m){S.mode=m;try{location.hash=m=='guided'?'guided':'demo'}catch(e){}render()}
// voice dictation
let REC=null,RK=null;
const SAMPLE={note:'Member reports more shortness of breath at night. Agreed to confirm the water pill dose with the prescriber. Daughter will drive to the follow-up visit.',c:'Short of breath at night, mild ankle swelling',m:'Unsure which dose to take',a:'Prefers a morning appointment next week',s:'Daughter can drive on Tuesdays',g:'Stay out of hospital and walk daily'};
function micUI(){document.querySelectorAll('.mic').forEach(b=>{const on=RK&&b.id=='mic_'+RK,sm=b.classList.contains('sm');b.classList.toggle('rec',!!on);b.textContent=sm?(on?'⏺':'🎙'):(on?'⏺ Listening… tap to stop':'🎙 Dictate')})}
function dictate(k){const was=RK;if(REC){REC.stop();if(was==k)return}
 const el=$('#ta_'+k);if(!el)return;const d=D(cur()),set=v=>{el.value=v;if(k=='note')d.note=v;else d.f[k]=v},b=el.value+(el.value&&!/\s$/.test(el.value)?' ':'');
 const end=()=>{REC=null;RK=null;micUI();render()};RK=k;
 const sim=()=>{const w=SAMPLE[k].split(' ');let i=0;toast('Microphone unavailable here, so dictation is simulated');const iv=setInterval(()=>{set(b+w.slice(0,++i).join(' '));if(i>=w.length){clearInterval(iv);end()}},160);REC={stop:()=>{clearInterval(iv);end()}};micUI()};
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){sim();return}
 try{const r=new SR();r.lang=/Spanish/.test(cur().c.lang)?'es-ES':'en-US';r.continuous=true;r.interimResults=true;let got=0;
  r.onresult=e=>{got=1;let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;set(b+t)};
  r.onerror=e=>{if(!got&&REC){REC=null;sim()}};r.onend=()=>{if(REC)end()};REC={stop:()=>r.stop()};r.start();micUI();toast('Listening… speak your note')}catch(e){REC=null;sim()}}
// phone view
const PHS=()=>S.ph||(S.ph={on:1,lead:10,clk:8,iv:0,cnt:0});
function phEv(){const e=[];FIX.forEach(f=>e.push({s:f[0],t:f[2],k:'fix',m:'Calendar'}));
 evs().filter(x=>x.d==9&&x.s!=null).forEach(x=>{const p=x.pid&&P.find(q=>q.id==x.pid);e.push({s:x.s,t:x.t,k:x.k,pid:x.pid,m:p?p.c.ch+' · best '+p.c.best+(p.ov.length?' · ⚑ escalation':''):''})});
 const td=evs().filter(x=>x.d==9&&x.k=='task');if(td.length)e.push({s:8,t:td.length+' tasks due today',k:'task',m:td.slice(0,2).map(x=>x.t).join(' · ')});return e.sort((a,b)=>a.s-b.s)}
function phNote(x){const h=PHS();return x.k=='task'?8:x.s-h.lead/60}
function phone2(){const h=PHS(),E=phEv(),n=h.on?E.filter(x=>phNote(x)<=h.clk).sort((a,b)=>phNote(b)-phNote(a)).slice(0,3):[],pop=n.length>h.cnt;h.cnt=n.length;const nx=E.find(x=>x.s>=h.clk);
 return`<div class="ph2"><div class="ph2s"><b>${hh(h.clk)}</b><span>5G ▮▮▮</span></div><div style="text-align:center;margin:6px 0 2px;font-size:11px;opacity:.7">Mon 9 Nov</div>${h.on?'':'<div class="ntf" style="opacity:.7;cursor:default">Notifications are off</div>'}${n.map((x,i)=>`<div class="ntf ${i==0&&pop?'pop':''}" ${x.pid?`onclick="go('out','${x.pid}')"`:''}><div class="row sp"><b>◉ HiLabs · ${x.k=='task'?'Tasks':'Calendar'}</b><span class="mu">${x.k=='task'?'Today':'in '+h.lead+' min'}</span></div><b>${x.t}</b><div>${x.k=='task'?'':hh(x.s)+' · '}${x.m}</div></div>`).join('')}<div class="ph2a"><b>Today’s agenda</b>${E.filter(x=>x.k!='task').map(x=>`<div class="it ${x.s<h.clk?'pst':''} ${nx==x?'nx':''}"><span class="mu" style="width:56px">${hh(x.s)}</span><span>${x.t}${nx==x?' <span class="chip Reported">Next</span>':''}</span></div>`).join('')}</div></div>`}
function phUp(){const h=PHS();$('#phoneRoot').innerHTML=phone2();$('#clkv').textContent=hh(h.clk);$('#clks').value=h.clk}
function phPlay(){const h=PHS();if(h.iv){clearInterval(h.iv);h.iv=0;render();return}if(h.clk>=17)h.clk=8;h.cnt=0;h.iv=setInterval(()=>{if(S.v!='ph'){clearInterval(h.iv);h.iv=0;return}h.clk=Math.min(17,+(h.clk+.1).toFixed(2));phUp();if(h.clk>=17){clearInterval(h.iv);h.iv=0;render()}},500);render()}
function PH(){const h=PHS();return`<div class="phl"><div class="card"><h2>Phone notifications</h2><label class="row sp"><span>Notify me about calendar items</span><input type="checkbox" class="tog g" ${h.on?'checked':''} onchange="PHS().on=this.checked;render()" aria-label="Notifications"></label><label class="row sp" style="margin-top:8px"><span>Remind me before</span><select onchange="PHS().lead=+this.value;render()">${[5,10,15,30].map(m=>`<option value="${m}" ${h.lead==m?'selected':''}>${m} min</option>`).join('')}</select></label><h3>Demo clock · <span id="clkv">${hh(h.clk)}</span></h3><input id="clks" type="range" min="8" max="17" step="0.1" value="${h.clk}" style="width:100%" aria-label="Demo clock" oninput="PHS().clk=+this.value;PHS().cnt=0;phUp()"><div class="row" style="margin-top:8px"><button class="btn p" onclick="phPlay()">${h.iv?'⏸ Pause':'▶ Play the day'}</button><button class="btn" onclick="PHS().clk=8;PHS().cnt=0;render()">Reset</button></div><div class="fr" style="margin-top:8px">Uses the calendar: huddle, lunch, documentation block, planned calls (use “Optimise my day” and add the plan) and tasks due today. A real app would use the phone’s own push notifications.</div></div><div id="phoneRoot">${phone2()}</div></div>`}
S.mode=location.hash=='#guided'?'guided':'demo';addEventListener('hashchange',()=>{S.mode=location.hash=='#guided'?'guided':'demo';render()});
try{const t=localStorage.getItem('hl-th');if(t&&t!='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}
render();
</script></body></html>
